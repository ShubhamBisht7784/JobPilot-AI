spring.config.import=optional:file:.env[.properties]


# ==========================================
# JobPilot AI - Local Development Configuration
# ==========================================

spring.application.name=jobpilot-backend
server.port=8080


# ==========================================
# PostgreSQL Database
# ==========================================

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/jobpilot_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ==========================================
# JWT Authentication
# ==========================================

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}


# ==========================================
# Resume File Storage
# ==========================================

app.file.upload-dir=${APP_UPLOAD_DIR:uploads/resumes}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


# Gmail token encryption is optional unless the Gmail integration is enabled.
app.crypto.encryption-key=${APP_CRYPTO_ENCRYPTION_KEY:}


# ==========================================
# Groq AI - Spring AI OpenAI Compatible API
# ==========================================

spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=${GROQ_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.temperature=0.2
spring.ai.openai.chat.max-tokens=4096
spring.ai.openai.chat.replay-reasoning-content=false

app.ai.enabled=${APP_AI_ENABLED:true}


# ==========================================
# SerpAPI - Job Discovery
# ==========================================

app.serpapi.api-key=${SERPAPI_API_KEY:}
app.serpapi.base-url=https://serpapi.com/search.json


# ==========================================
# Hunter.io - Recruiter Email Discovery
# ==========================================

app.hunter.api-key=${HUNTER_API_KEY:}
app.hunter.base-url=https://api.hunter.io/v2


# ==========================================
# Job Discovery Scheduler
# ==========================================

app.job-discovery.enabled=${JOB_DISCOVERY_ENABLED:true}
app.job-discovery.fixed-delay-ms=${JOB_DISCOVERY_FIXED_DELAY_MS:21600000}
app.job-discovery.initial-delay-ms=${JOB_DISCOVERY_INITIAL_DELAY_MS:60000}

app.job-discovery.queries=${JOB_DISCOVERY_QUERIES:Java Backend Developer fresher India,Java Full Stack Developer fresher India,Spring Boot Developer entry level India}


# ==========================================
# CORS Configuration
# ==========================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}


# ==========================================
# Logging
# ==========================================

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
